<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Uninstall VXOST">
  <title>Uninstall VXOST</title>
  <!--
    Variante grigia del marchio, per l'icona di uninstall.app.

    Perche' non si riusa vxost-logo.svg tale e quale: nel Finder le due
    applicazioni stanno una accanto all'altra, e con la stessa icona chi
    vuole aprire VXOST finisce prima o poi per lanciare il disinstallatore.
    Il colore e' l'unica cosa che si distingue a colpo d'occhio nel Dock, a
    16 pixel, dove la forma non si legge piu'.

    I grigi non sono neutri ma leggermente freddi (l'azzurro cresce con la
    luminosita'), perche' il grigio puro su fondo chiaro sembra un'icona
    disabilitata invece che una scelta.

    Le fermate del gradiente restano cinque e nelle stesse posizioni: la
    diagonale del marchio si riconosce anche senza i colori.
  -->
  <defs>
    <linearGradient id="vxost-uninstall-bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"    stop-color="#3A3A42"/>
      <stop offset="0.26" stop-color="#55555F"/>
      <stop offset="0.55" stop-color="#787885"/>
      <stop offset="0.78" stop-color="#95959F"/>
      <stop offset="1"    stop-color="#AFAFB8"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#vxost-uninstall-bg)"/>

  <!-- Il simbolo occupa il 52% del lato: sotto, si perde alle dimensioni
       piccole del Dock; sopra, tocca la curva della superellisse. -->
